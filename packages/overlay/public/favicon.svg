<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Stream Control">
  <!--
    The same chat bubble as the desktop panel's icon, so the tab, the taskbar
    and the installer are one mark rather than three.

    The tile is the difference. The panel icon is a bare cyan bubble on
    transparency, which is fine on a dark taskbar and nearly invisible on a
    light tab strip - #25f4ee against white is about 1.4:1. Sitting it on the
    dashboard's own near-black gives the mark its contrast from itself instead
    of borrowing it from whatever chrome the browser happens to be wearing, so
    it reads the same in both themes.
  -->
  <rect width="32" height="32" rx="7" fill="#0e111b"/>
  <g transform="translate(1.7 1.57) scale(0.88)">
    <path d="M7.2 20h6.2L7.2 28.4z" fill="#25f4ee"/>
    <rect x="3.75" y="4.4" width="25" height="18.1" rx="3.1" fill="#25f4ee"/>
    <!-- Holes, not marks: same fill as the tile, so they stay dots at any size. -->
    <g fill="#0e111b">
      <circle cx="10.85" cy="13.45" r="2.15"/>
      <circle cx="16.25" cy="13.45" r="2.15"/>
      <circle cx="21.65" cy="13.45" r="2.15"/>
    </g>
  </g>
</svg>
